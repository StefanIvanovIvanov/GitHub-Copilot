<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bucks2Bar</title>
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />
  <style>
    body { background-color: #ffffff; }
    .app-header { background: transparent; padding-top: 1.5rem; padding-bottom: 0.5rem; }
    .app-title { font-size: 2rem; font-weight: 700; }
    #chartWrapper { position: relative; height: 56vh; min-height: 360px; }
    .month-col { width: 160px; }
    .num-col { width: 340px; }
    .form-control { border-radius: 6px; }
    .input-group-text { border-radius: 6px 0 0 6px; }
    .card { border: 0; }
    .nav-tabs .nav-link { color: #0d6efd; }
    /* All buttons pink with hover/active darker shade */
    .btn, .btn-download, .btn-primary, .btn-outline-secondary { background-color: #ff69b4; color: #fff; border: 0; }
    .btn:hover, .btn:focus, .btn-download:hover, .btn-primary:hover, .btn-outline-secondary:hover { background-color: #ff4fa6; color: #fff; }
    .btn-pink:disabled { opacity: 0.65; pointer-events: none; }
    @media (min-width: 992px) {
      .container { max-width: 1000px; }
    }
  </style>
</head>
<body>

  <header class="app-header text-dark mb-4">
    <div class="container">
      <h1 class="app-title mb-1">Bucks2Bar - Budget Tracker</h1>
      <ul class="nav nav-tabs mt-2" style="display:none"></ul>
      <form id="usernameForm" class="row g-2 align-items-center mt-3" novalidate>
        <div class="col-sm-8">
          <label for="usernameInput" class="form-label visually-hidden">Username</label>
          <div class="input-group">
            <span class="input-group-text">@</span>
            <input type="text" id="usernameInput" class="form-control" placeholder="Enter username" aria-describedby="usernameHelp" required />
          </div>
          <div id="usernameHelp" class="form-text small">Username must be at least 5 characters, include 1 uppercase and 1 special character.</div>
          <div id="usernameFeedback" class="invalid-feedback"></div>
          <div id="usernameSuccess" class="text-success small mt-1" role="status" aria-live="polite"></div>
        </div>
        <div class="col-sm-4 d-flex align-items-start">
          <button type="submit" id="usernameSubmit" class="btn btn-primary ms-auto">Submit</button>
        </div>
      </form>
    </div>
  </header>

  <div class="container pb-5">

    <!-- Username input removed per request -->
    <!-- Tab nav -->
    <ul class="nav nav-tabs" id="mainTabs" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active fw-semibold" id="tab-data-btn"
          data-bs-toggle="tab" data-bs-target="#tab-data"
          type="button" role="tab" aria-controls="tab-data" aria-selected="true">
          &#128203; Data
        </button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link fw-semibold" id="tab-chart-btn"
          data-bs-toggle="tab" data-bs-target="#tab-chart"
          type="button" role="tab" aria-controls="tab-chart" aria-selected="false">
          &#128202; Chart
        </button>
      </li>
    </ul>

    <div class="tab-content" id="mainTabContent">
      <div class="tab-pane fade show active" id="tab-data" role="tabpanel" aria-labelledby="tab-data-btn">
        <div class="card shadow-sm mt-3">
          <div class="card-body p-0">
            <div id="monthTable" class="p-3">
              <!-- month rows injected by script.js -->
            </div>
          </div>
        </div>
        <div class="mt-3 d-flex gap-2 align-items-center">
          <button id="updateChart" class="btn btn-link p-0">Data</button>
          <div class="ms-auto">
            <button id="clearAll" class="btn btn-outline-secondary">Clear All</button>
            <button id="updateChart2" class="btn btn-primary ms-2">Update Chart</button>
          </div>
        </div>
      </div>

      <!-- CHART TAB -->
      <div class="tab-pane fade" id="tab-chart" role="tabpanel" aria-labelledby="tab-chart-btn">
        <div class="card shadow-sm mt-3">
          <div class="card-header bg-white fw-semibold text-muted small">
            Income vs Expenses &mdash; Jan to Dec
          </div>
          <div class="card-body">
            <div class="d-flex gap-2 mb-3">
              <button id="downloadChart" class="btn btn-download">Download</button>
            </div>
            <div id="chartWrapper">
              <canvas id="barChart"></canvas>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"
  ></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="script.js"></script>
  <script>
    // Download the Chart as a PNG file (uses Chart.js API when available)
    (function () {
      const btn = document.getElementById('downloadChart');
      if (!btn) return;
      btn.addEventListener('click', function () {
        const canvas = document.getElementById('barChart');
        if (!canvas) return;
        // Prefer Chart.js API if chart instance exists
        let url = null;
        try {
          if (window.chartInstance && typeof window.chartInstance.toBase64Image === 'function') {
            url = window.chartInstance.toBase64Image('image/png', 1);
          }
        } catch (e) {
          // fall through to canvas fallback
        }
        if (!url) {
          url = canvas.toDataURL('image/png');
        }
        const link = document.createElement('a');
        link.href = url;
        link.download = 'bucks2bar-chart.png';
        document.body.appendChild(link);
        link.click();
        link.remove();
      });
    })();
  </script>
</body>
</html>
